name: tests

on:
  push:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Demo, verify, tamper
        run: |
          python3 -m handoff demo
          python3 -m handoff verify
          python3 -m handoff tamper || true
      - name: Fail if the chain did not verify
        run: python3 -m handoff verify

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Contract tests
        run: cargo test --manifest-path contracts/handoff/Cargo.toml
