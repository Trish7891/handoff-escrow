[package]
name = "handoff-escrow"
version = "0.1.0"
edition = "2021"
description = "Escrow for agent labour: money moves when a machine can check the work."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
